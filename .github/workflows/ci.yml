name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # uv reads the Python version from .python-version and the tools from uv.lock.
      - name: Install the tools
        run: uv sync --locked
      - name: Lint the Python tools
        run: uv run ruff check --no-fix
      - name: Check the formatting of the Python tools
        run: uv run ruff format --check
      - name: Test the check script
        run: uv run pytest
      - name: Check the indicator source
        run: uv run tools/check.py
